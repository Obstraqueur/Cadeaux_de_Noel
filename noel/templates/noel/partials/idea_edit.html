<li class="tag tag--editing" id="idea-{{ idea.pk }}"><div class="tag__paper">
  <form class="ideaform" hx-post="{% url 'idea_edit' family.slug idea.pk %}" hx-target="closest li" hx-swap="outerHTML">
    {% include 'noel/partials/fields.html' %}
    <div class="ideaform__actions">
      <button class="btn btn--ghost" type="submit" name="cancel" value="1" formnovalidate>Annuler</button>
      <button class="btn btn--primary" type="submit">Enregistrer</button>
    </div>
  </form>
</div></li>
