{% extends 'noel/base.html' %}{% load static %}
{% block body_class %}auth{% endblock %}
{% block content %}
<div class="authcard">
  <canvas class="snow" aria-hidden="true"></canvas>
  <div class="authcard__head">
    <img src="{% static 'noel/img/icon.svg' %}" alt="" width="56" height="56">
    <h1 class="authcard__title">{% block heading %}{% endblock %}</h1>
    <p class="authcard__sub">{% block sub %}{% endblock %}</p>
  </div>
  <div class="authcard__body">{% block form %}{% endblock %}</div>
</div>
{% endblock %}
