<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3B2E">
  <meta name="robots" content="noindex">
  <title>Cadeaux de Noël</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Charge toujours la dernière version du site (GitHub Pages garde les fichiers 10 min en cache).
    (async () => {
      let v = "";
      try { v = (await (await fetch("version.txt", { cache: "no-store" })).text()).trim(); } catch (e) {}
      const q = v ? "?v=" + encodeURIComponent(v) : "";
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "assets/app.css" + q; document.head.appendChild(css);
      await new Promise((ok, ko) => { const s = document.createElement("script"); s.src = "assets/vendor/supabase-2.117.3.js"; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
      const m = document.createElement("script"); m.type = "module"; m.src = "assets/js/app.js" + q; document.head.appendChild(m);
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="topbar" id="topbar" hidden>
    <canvas class="snow" aria-hidden="true"></canvas>
    <div class="topbar__inner" id="topbar-inner"></div>
  </header>
  <main id="main" class="page" tabindex="-1">
    <p class="loading">Chargement…</p>
  </main>
  <div class="toasts" aria-live="polite"></div>
  <dialog class="confirm" id="confirm-dialog">
    <form method="dialog">
      <p class="confirm__text"></p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" value="cancel">Annuler</button>
        <button class="btn btn--danger" value="ok">Confirmer</button>
      </div>
    </form>
  </dialog>
  <noscript>Ce site a besoin de JavaScript.</noscript>
</body>
</html>
